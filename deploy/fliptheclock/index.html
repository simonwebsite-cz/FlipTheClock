<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipTheClock!</title>

<!--
  The site lives at /FlipTheClock/. The server runs Linux, where paths are
  case-sensitive, so /fliptheclock/ is a different path and would 404.

  A desktop browser usually hides this: the address bar autocompletes to a
  URL already in history, with the capitals restored. On a phone, with no
  such history, whatever was typed is sent verbatim and the mismatch shows.

  A server-side 301 would be the proper fix, but that needs an nginx
  redirect. This page is the file-only equivalent: upload it and nothing
  else changes.
-->
<link rel="canonical" href="https://www.tichysimon.cz/FlipTheClock/">
<meta http-equiv="refresh" content="0; url=/FlipTheClock/">
<meta name="robots" content="noindex">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #8a8a8a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  a { color: #fff; }
</style>
</head>
<body>
  <p>
    Taking you to <a href="/FlipTheClock/">FlipTheClock!</a>&hellip;
  </p>

  <script>
    // Fires before the meta refresh and leaves no extra history entry, so
    // Back returns to wherever the visitor came from rather than bouncing
    // them through here again.
    location.replace('/FlipTheClock/');
  </script>
</body>
</html>
