name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - name: Rename exe to .scr
        run: Copy-Item app\build\windows\x64\runner\Release\*.exe windows\x64\FlipTheClock.scr
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: windows/x64/FlipTheClock.scr

  windows-arm64:
    # flutter build windows always targets the machine's own architecture —
    # there is no --target-platform flag to cross-compile from x64. A real
    # ARM64 Windows runner is required to produce an ARM64 binary.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - name: Rename exe to .scr
        run: Copy-Item app\build\windows\arm64\runner\Release\*.exe windows\arm\FlipTheClock.scr
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: windows/arm/FlipTheClock.scr

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
        working-directory: app

      # Without key.properties the Gradle config silently falls back to
      # Flutter's debug key (see app/android/app/build.gradle.kts). That key
      # is public, so a debug-signed APK must never be published: anyone
      # could sign an "update" Android would accept as the same app.
      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build a release APK that would be signed with the public debug key. See CONTRIBUTING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > app/android/key.properties

      - run: flutter build apk --release
        working-directory: app

      # Belt and braces: the fallback above is silent by design, so prove
      # the artifact we are about to publish is not debug-signed.
      - name: Verify the APK is not debug-signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs             app/build/app/outputs/flutter-apk/app-release.apk > certs.txt
          cat certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is signed with the Android debug key. Refusing to publish."
            exit 1
          fi

      - run: cp app/build/app/outputs/flutter-apk/app-release.apk android/FlipTheClock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/FlipTheClock.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --release
        working-directory: app
      - name: Package the .app
        run: |
          mkdir -p apple/macos
          ditto app/build/macos/Build/Products/Release/FlipTheClock.app                 apple/macos/FlipTheClock.app
          # `zip -r` dereferences the symlinks inside Contents/Frameworks,
          # which both bloats the archive and invalidates the bundle. ditto's
          # archive mode is Apple's supported way to zip an .app.
          ditto -c -k --sequesterRsrc --keepParent                 apple/macos/FlipTheClock.app                 apple/macos/FlipTheClock-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apple/macos/FlipTheClock-macos.zip

  release:
    needs: [windows-x64, windows-arm64, android, macos]
    runs-on: ubuntu-latest
    # New repositories default GITHUB_TOKEN to read-only, which makes
    # creating a release fail with 403. Request the write scope explicitly
    # on this job only, rather than relying on the account-wide default.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-x64/FlipTheClock.scr
            dist/windows-arm64/FlipTheClock.scr
            dist/android/FlipTheClock.apk
            dist/macos/FlipTheClock-macos.zip
